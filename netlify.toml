[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[functions]
  directory = "netlify/functions"
